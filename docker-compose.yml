services:
  # ── Backend: Spring Boot (REST + SOAP + gRPC) ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gympilot-backend
    restart: unless-stopped
    ports:
      - "8081:8081"   # REST (/api) & SOAP (/ws)
      - "9090:9090"   # gRPC
    environment:
      - PORT=8081
      - JAVA_OPTS=-Xms256m -Xmx512m
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-86400000}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8081,http://localhost
      - AI_BASE_URL=${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - AI_MODEL=${AI_MODEL:-gemini-3.7-flash}
      - AI_VISION_MODEL=${AI_VISION_MODEL:-gemini-3.7-flash}
      - AI_API_KEY=${AI_API_KEY:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-GymPilot <support@gympilot.tn>}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-gimpilot411@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-ljwulmbdzdopxpmq}
      - APP_MAIL_FROM=${APP_MAIL_FROM:-gimpilot411@gmail.com}
      - APP_MAIL_FROM_NAME=${APP_MAIL_FROM_NAME:-GymPilot Support}
      - APP_FRONTEND_URL=http://localhost:5173
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-dvfrd0ehf}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-777366458436392}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-kjVQbJ07IMvwzvVHs9Uv819yup0}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - gympilot-net

  # ── Frontend: React Vite dev server (Node.js directly) ───────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gympilot-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8081/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gympilot-net

networks:
  gympilot-net:
    driver: bridge
